name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime_pin:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
      exists: ${{ steps.pin.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(tr -d '[:space:]' < runtime-release.txt)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  ensure_runtime:
    needs: runtime_pin
    if: needs.runtime_pin.outputs.exists == 'false'
    uses: ./.github/workflows/runtime.yml
    with:
      tag: ${{ needs.runtime_pin.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit

  build:
    needs: [runtime_pin, ensure_runtime]
    # A skipped ensure_runtime means the pinned release already existed.
    if: always() && needs.runtime_pin.result == 'success' && (needs.ensure_runtime.result == 'success' || needs.ensure_runtime.result == 'skipped')
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    # The Windows runner's console defaults to cp1252; helper scripts print
    # Chinese progress lines, so force UTF-8 for every Python invocation.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: manager/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
          architecture: x64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set version from tag
        id: version
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          config_path = Path("manager/src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          version = config["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              match = re.fullmatch(r"v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))",
                                   os.environ["GITHUB_REF_NAME"])
              if not match:
                  raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0")
              version = match[1]
          config["version"] = version
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          for name in ("manager/package.json", "manager/package-lock.json"):
              path = Path(name)
              data = json.loads(path.read_text(encoding="utf-8"))
              data["version"] = version
              if "packages" in data:
                  data["packages"][""]["version"] = version
              path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          for name in ("Cargo.toml", "Cargo.lock"):
              path = Path("manager/src-tauri") / name
              text = path.read_text(encoding="utf-8")
              pattern = r'(name = "shadowfox-manager"\nversion = ")[^"]+(")'
              text, count = re.subn(pattern, lambda m: m[1] + version + m[2], text)
              if count != 1:
                  raise SystemExit(f"Cannot locate application version in {path}")
              path.write_text(text, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")

      - name: Install frontend dependencies
        working-directory: manager
        run: npm ci --include=dev

      - name: Fetch browser engine and assemble runtime resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m venv build/runtime-env
          if ($LASTEXITCODE -ne 0) { throw 'Runtime venv creation failed' }
          $runtimePython = './build/runtime-env/Scripts/python.exe'
          & $runtimePython -m pip install -r requirements-runtime.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
          & $runtimePython -m camoufox fetch
          if ($LASTEXITCODE -ne 0) { throw 'Browser download failed' }
          $engine = & $runtimePython -c "from camoufox.pkgman import camoufox_path; print(camoufox_path(download_if_missing=False))"
          if ($LASTEXITCODE -ne 0) { throw 'Browser runtime not found' }
          $tag = (Get-Content runtime-release.txt -Raw).Trim()
          if (-not $tag) { throw 'runtime-release.txt is empty' }
          python tools/prepare_app_release.py --tag $tag --engine $engine --assets build/runtime-assets
          if ($LASTEXITCODE -ne 0) { throw 'Runtime resource assembly failed' }

      - name: Check backend and frontend
        run: |
          python -m pip install -r requirements-runtime.txt pytest fonttools==4.60.1
          if ($LASTEXITCODE -ne 0) { throw 'pytest installation failed' }
          python -m pytest checks -q -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { throw 'Backend checks failed' }
          npm --prefix manager exec -- tsc --noEmit --project manager/tsconfig.json
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript checks failed' }

      - name: Check runtime manifest and installer
        run: |
          $tag = (Get-Content runtime-release.txt -Raw).Trim()
          python tools/check_runtime_manifest.py --tag $tag
          if ($LASTEXITCODE -ne 0) { throw 'Runtime manifest check failed' }
          cargo test --manifest-path manager/src-tauri/Cargo.toml --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Runtime installer checks failed' }

      - name: Smoke test current app with fixed runtime assets
        run: |
          python tools/smoke_release.py --resources manager/src-tauri/resources --assets build/runtime-assets
          if ($LASTEXITCODE -ne 0) { throw 'Current app and fixed runtime smoke check failed' }

      - name: Build Windows x64 installer
        working-directory: manager
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Collect release files and SHA256 checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installers = @(Get-ChildItem manager/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $name = "Cacer_$($env:RELEASE_VERSION)_windows_x64-setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path release-assets $name)
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii release-assets/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Cacer-${{ steps.version.outputs.version }}-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cacer-${{ needs.build.outputs.version }}-windows-x64
          path: release-assets

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "Cacer $RELEASE_VERSION" \
            --generate-notes
